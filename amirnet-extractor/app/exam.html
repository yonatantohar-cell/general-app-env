var sampleApi=null, dbApi=null, userApi=null;
var capsReady=false;
var cards={};                /* word -> scheduling + hook, kept per viewer */
var T={word:null, phase:"idle", judged:null, queue:[], session:{seen:0, right:0}};

/*
 * WHOSE DATA IS THIS.
 *
 * Everything a person builds here — their hooks, their meanings, their review
 * schedule — is private to them. It lives under `data/users/<their id>`, a
 * path the platform keeps private per viewer: nobody else reads it, the
 * artifact's owner included. Share this page with someone and they get the
 * whole app and their own, separate progress; neither of you ever sees the
 * other's.
 *
 * `uid` is the awaited `user.id()`, and the store accepts exactly that value
 * as this viewer — no substitute works. A null id means no private subtree at
 * all, which is the case for someone admitted read-only; the app then keeps
 * their work in this browser and says so, rather than moving it anywhere
 * shared.
 */
var uid=null, isOwner=false, dbWritable=true;

try{
  if(window.claude&&typeof window.claude.use==="function"){
    Promise.all([
      window.claude.use("sample").then(function(a){sampleApi=a||null}).catch(function(){}),
      window.claude.use("db").then(function(a){dbApi=a||null}).catch(function(){}),
      window.claude.use("user").then(function(a){userApi=a||null}).catch(function(){})
    ]).then(function(){
      if(!userApi) return null;
      return Promise.all([
        Promise.resolve().then(function(){ return userApi.id() }).catch(function(){ return null }),
        Promise.resolve().then(function(){ return userApi.isOwner() }).catch(function(){ return false })
      ]).then(function(r){ uid=r[0]||null; isOwner=Boolean(r[1]) });
    }).catch(function(){}).then(function(){
      capsReady=true;
      paintWhoAmI();
      if($("pane-trainer") && !$("pane-trainer").hidden) renderTrainer();
    });
  } else { capsReady=true; }
}catch(e){ capsReady=true; }

/* The owner sees that this is their own copy; a guest sees nothing extra. */
function paintWhoAmI(){
  var e=$("whoami"); if(!e) return;
  var base="20 סימולציות · 580 שאלות";
  e.textContent = isOwner ? (base+" · מצב מנהל") : base;
}

/* Document ids accept letters, digits and `_ - . ~ : @ +` only. */
function docId(word){
  return String(word||"").toLowerCase().replace(/[^a-z0-9_.~:@+-]/g,"-").slice(0,120) || "-";
}

/** This viewer's own card collection, or null when they have no private one. */
function myCards(){
  if(!dbApi||!uid) return null;
  try{ return dbApi.collection("data/users/"+uid) }catch(e){ return null }
}

/* ---------- scheduling: SM-2, trimmed to what this needs ---------- */
var DAY=86400000;
function newCard(word){ return {word:word, ease:2.5, interval:0, lapses:0, reps:0, due:0}; }

/*
 * A card you are allowed to write to.
 *
 * Cards loaded from the app's own storage are document snapshots, and snapshot
 * bodies are FROZEN. Under "use strict" — which this whole script runs in — a
 * write to a frozen object throws, so every save silently died the moment the
 * card had come from storage rather than from this session. Nothing mutates a
 * card in place any more; each path copies, edits the copy, and stores that.
 */
function cloneCard(c){
  if(!c) return newCard("");
  try{ return JSON.parse(JSON.stringify(c)) }
  catch(e){ var o={}; for(var k in c) if(Object.prototype.hasOwnProperty.call(c,k)) o[k]=c[k]; return o }
}
/* `recognition` marks an answer picked from four options rather than recalled
   from nothing. It still moves the word further out, but it does not earn the
   ease bump: knowing it when you see it is not the same as knowing it. */
function schedule(card, correct, recognition){
  var c=cloneCard(card||newCard(""));
  c.reps=(c.reps||0)+1;
  if(correct){
    c.interval = !c.interval ? 1 : Math.max(1, Math.round(c.interval*c.ease));
    if(!recognition) c.ease = Math.min(3.0, (c.ease||2.5)+0.1);
  }else{
    c.interval = 1;                                  /* back tomorrow */
    c.ease = Math.max(1.3, (c.ease||2.5)-0.2);       /* and more often after that */
    c.lapses = (c.lapses||0)+1;
  }
  c.due = Date.now() + c.interval*DAY;
  return c;
}

/* ---------- picking the next word ---------- */
function nextWord(){
  if(T.queue.length) return T.queue.shift();          /* missed earlier this session */
  var now=Date.now();
  var due=Object.keys(cards).map(function(k){return cards[k]})
    .filter(function(c){return c.due && c.due<=now})
    .sort(function(a,b){return a.due-b.due});
  if(due.length) return due[0].word;
  var fresh=TRAINER.filter(function(w){return !cards[w.word]});
  if(fresh.length) return fresh[0].word;              /* pool is ranked by frequency */
  var all=Object.keys(cards).map(function(k){return cards[k]}).sort(function(a,b){return a.due-b.due});
  return all.length?all[0].word:null;
}

/* Loads the trainer pool and the saved cards once, whichever tab asks first. */
var trainerDataReady=null;
function ensureTrainerData(){
  if(trainerDataReady) return trainerDataReady;
  trainerDataReady = (TRAINER ? Promise.resolve(TRAINER)
                              : fetch("trainer-words.json").then(function(r){return r.json()})
                                  .then(function(j){ TRAINER=j; return j })
                                  .catch(function(){ return null }))
    .then(function(){ return loadCards() })
    .catch(function(){});
  return trainerDataReady;
}

/* The trainer-pool entry for a word: what the course teaches about it, meaning
   and hook alike. The vocabulary tab reads from here too, because this is the
   only file that carries the Hebrew glosses. */
function courseEntry(word){
  if(!TRAINER) return null;
  return TRAINER.filter(function(w){return w.word===word})[0]||null;
}

/* Take the course's hook for a word as your own, from wherever it is shown.
   A word with no card yet gets one, so the schedule starts from this moment. */
function adoptCourseHook(word, entry, btn){
  var c=cloneCard(cards[word]||newCard(word));
  c.word=word;
  if(!c.meaning && entry && entry.he) c.meaning=entry.he;
  c.mnemonic=entry.seed.hook;
  c.source="course";
  c.savedAt=Date.now();
  if(!c.due) c.due=Date.now();       /* due now: it enters the review queue */
  cards[word]=c;
  persistCard(c);
  if(btn){ btn.textContent="נשמר ✓"; btn.disabled=true }
}

/* The course-authored hook for a word, when the sheets supplied one. */
function seedFor(word){
  if(!TRAINER) return null;
  var e=TRAINER.filter(function(w){return w.word===word})[0];
  return (e&&e.seed&&e.seed.hook)?e.seed:null;
}

/* ---------- asking Claude ---------- */
function judgePrompt(word, guess, seed){
  /* Five words arrive with the hook the course itself titled their sheet with.
     Inventing a rival hook for those would only compete with what he already
     memorised, so the course's one is handed over to be reused. */
  var seeded = seed&&seed.hook ? [
'',
'שים לב: הקורס עצמו כבר נתן למילה הזו סימן — "'+seed.hook+'".',
'השתמש בו כ-"mnemonic" במקום להמציא אחר, וכתוב "story" שמחבר אותו למשמעות.'
  ] : [];
  return [
'אתה עוזר ללומד ישראלי שמתכונן לבחינת אמירנט באנגלית.',
'',
'המילה: "'+word+'"',
'מה שהלומד כתב שהפירוש: "'+guess+'"',
'',
'החזר JSON בלבד, בדיוק במבנה הזה:',
'{',
'  "verdict": "correct" | "partial" | "wrong",',
'  "meaning": "הפירוש בעברית, 2-5 מילים",',
'  "english": "a short English gloss",',
'  "note": "משפט אחד שמסביר למה התשובה נכונה/חלקית/שגויה",',
'  "mnemonic": "הסימן עצמו",',
'  "story": "משפט קצר וויזואלי שמחבר את הסימן למשמעות"',
'}',
'',
'כללי הסימן — זה החלק החשוב, אל תדלג עליו:',
'הסימן הוא פירוק פונטי של המילה האנגלית למילים עבריות שנשמעות כמוה,',
'ואז תמונה שמקשרת אותן למשמעות. זה לא תרגום ולא אטימולוגיה.',
'',
'כך הלומד עצמו עושה את זה:',
'  abduct (לחטוף) ← נשמע "אבא דק" ← אבא ברווז ←',
'  הסיפור: "אבא ברווז חטף את הילד שלו"',
'  ומאז כשהוא רואה abduct הוא נזכר מיד בחטיפה.',
'',
'אם אי אפשר לפרק את המילה פונטית לעברית בצורה טבעית, בנה את הסימן על',
'דמיון למילה עברית או אנגלית מוכרת — אבל שהקשר למשמעות יישאר חד.',
'סימן אחד חזק עדיף על שלושה חלשים. אל תמציא עברית שלא קיימת.'
  ].concat(seeded).join('\n');
}

/* ---------- rendering ---------- */
function renderTrainer(){
  var p=$("pane-trainer"); p.textContent="";

  if(!TRAINER){
    p.appendChild(el("div","muted","טוען מילים…"));
    ensureTrainerData().then(function(){
      if(TRAINER) renderTrainer();
      else { p.textContent=""; p.appendChild(el("div","card set","לא ניתן לטעון את רשימת המילים.")) }
    });
    return;
  }

  var head=el("div");
  var h=el("h2",null,"מאמן מילים"); h.style.cssText="font-size:23px;margin-bottom:6px";
  head.appendChild(h);
  var known=Object.keys(cards).length;
  var sub=el("p","muted", TRAINER.length+" מילים במאגר · "+known+" כבר התחלת · "+
            (T.session.seen?("הפעם: "+T.session.right+"/"+T.session.seen):"מדורגות לפי כמה הן חוזרות"));
  sub.style.cssText="margin:0 0 14px;font-size:14px";
  head.appendChild(sub);
  p.appendChild(head);

  if(!capsReady){ p.appendChild(el("div","card set","מתחבר…")); return }

  /* The quiz is built from the saved cards alone, so it must be reachable even
     where judging is not permitted — hence both the switch and the quiz branch
     sit above the `sampleApi` check that the practice flow depends on. */
  var pool=quizPool();
  if(pool.length) p.appendChild(modeSwitch(pool.length));
  if(MODE==="quiz"){ renderQuizInto(p, pool); p.appendChild(storageNote()); return }
  if(MODE==="library"){ renderLibrary(p); p.appendChild(storageNote()); return }

  if(!sampleApi){
    var warn=el("div","card set");
    warn.appendChild(el("div","eyebrow","המאמן צריך הרשאה"));
    var w1=el("p",null,"כדי לשפוט את הפירוש שלך ולבנות איתך סימן, הדף צריך לשאול אותי בזמן אמת — וההרשאה לכך לא ניתנה בתצוגה הזו.");
    w1.style.cssText="margin:8px 0;font-size:14.5px"; warn.appendChild(w1);
    var w2=el("p","muted","אפשר לאשר דרך תפריט ההרשאות של הדף. בלי זה אני לא יכול לדעת אם צדקת — ולא אנחש.");
    w2.style.cssText="margin:0;font-size:13.5px"; warn.appendChild(w2);
    var openPerms=el("button","btn ghost","פתח הרשאות"); openPerms.style.marginTop="12px";
    openPerms.onclick=function(){
      try{ window.claude.use("permissions").then(function(pm){ pm&&pm.manage&&pm.manage() }) }catch(e){}
    };
    warn.appendChild(openPerms);
    p.appendChild(warn);
    p.appendChild(storageNote());
    return;
  }

  if(!T.word) T.word=nextWord();
  if(!T.word){ p.appendChild(el("div","card set","אין מילים זמינות.")); return }

  var card=el("div","card"); card.style.padding="22px 20px";
  var entry=TRAINER.filter(function(w){return w.word===T.word})[0]||{};
  var c=cards[T.word];

  var top=el("div","row"); top.style.cssText="justify-content:space-between;align-items:baseline";
  var wordEl=el("div","en",T.word);
  wordEl.style.cssText="font-family:var(--font-display);font-weight:900;font-size:34px;color:var(--accent);line-height:1.1";
  top.appendChild(wordEl);
  if(c&&c.lapses) top.appendChild(el("span","pill","טעית בה "+c.lapses+(c.lapses===1?" פעם":" פעמים")));
  else if(entry.times>1) top.appendChild(el("span","pill","חוזרת "+entry.times+" פעמים"));
  card.appendChild(top);

  if(T.phase==="idle"||T.phase==="judging"){
    var ask=el("p","muted","מה הפירוש? כתוב מה שאתה חושב, גם אם אתה לא בטוח.");
    ask.style.cssText="margin:12px 0 8px;font-size:14.5px"; card.appendChild(ask);

    var ta=document.createElement("textarea");
    ta.className="note-field"; ta.rows=2; ta.id="guessField";
    ta.placeholder="הפירוש בעברית…"; ta.value=T.guessDraft||"";
    ta.oninput=function(){T.guessDraft=ta.value};
    ta.onkeydown=function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) submitGuess() };
    card.appendChild(ta);

    var row=el("div","row"); row.style.marginTop="12px";
    var go=el("button","btn", T.phase==="judging"?"בודק…":"בדוק");
    go.disabled = T.phase==="judging";
    go.onclick=submitGuess; row.appendChild(go);
    var skip=el("button","btn ghost","לא יודע");
    skip.disabled = T.phase==="judging";
    skip.onclick=function(){ T.guessDraft="—"; submitGuess() };
    row.appendChild(skip);
    if(T.error){ var er=el("span","muted",T.error); er.style.fontSize="13.5px"; row.appendChild(er) }
    card.appendChild(row);
  }

  if(T.phase==="result"&&T.judged){
    var j=T.judged;
    var VERDICT={correct:["נכון","var(--good)","var(--good-soft)"],
                 partial:["כמעט","var(--warn)","color-mix(in srgb,var(--warn) 14%,transparent)"],
                 wrong:["לא נכון","var(--bad)","var(--bad-soft)"]};
    var v=VERDICT[j.verdict]||VERDICT.wrong;
    var badge=el("div",null,v[0]);
    badge.style.cssText="display:inline-block;font-weight:700;padding:5px 14px;border-radius:999px;margin:14px 0 10px;color:"+v[1]+";background:"+v[2];
    card.appendChild(badge);

    var mean=el("p",null,"");
    mean.style.cssText="margin:0 0 4px;font-size:17px;font-weight:700";
    mean.textContent=j.meaning||"";
    card.appendChild(mean);
    if(j.english){ var en=el("p","muted en",j.english); en.style.cssText="margin:0 0 10px;font-size:14px"; card.appendChild(en) }
    if(j.note){ var nt=el("p","muted",j.note); nt.style.cssText="margin:0 0 14px;font-size:14px"; card.appendChild(nt) }

    var hook=el("div","expl"); hook.style.marginTop="4px";
    hook.appendChild(el("div","eyebrow","הסימן שאני מציע"));
    var mn=el("p",null,j.mnemonic||""); mn.style.cssText="margin:8px 0 4px;font-size:16px;font-weight:700";
    hook.appendChild(mn);
    if(j.story){ var st=el("p",null,"„"+j.story+"”"); st.style.cssText="margin:0;font-size:15px"; hook.appendChild(st) }
    card.appendChild(hook);

    /* A word the course already titled a sheet with gets that hook shown too, as
       its own choice — it is the one he may already have seen in the sheets. */
    var seedHook=seedFor(T.word);
    if(seedHook&&!T.writingOwn){
      var sc=el("div","expl"); sc.style.marginTop="10px";
      sc.appendChild(el("div","eyebrow","הסימן מהקורס"));
      var sh=el("p",null,seedHook.hook); sh.style.cssText="margin:8px 0 4px;font-size:16px;font-weight:700";
      sc.appendChild(sh);
      if(seedHook.story){ var ss=el("p",null,"„"+seedHook.story+"”"); ss.style.cssText="margin:0;font-size:15px"; sc.appendChild(ss) }
      var takeSeed=el("button","btn ghost","שמור את הסימן מהקורס"); takeSeed.style.marginTop="12px";
      takeSeed.onclick=function(){ saveAndAdvance(seedHook.hook+(seedHook.story?" — "+seedHook.story:""), "course") };
      sc.appendChild(takeSeed);
      card.appendChild(sc);
    }

    if(T.phase==="result"&&T.writingOwn){
      var own=document.createElement("textarea");
      own.className="note-field"; own.rows=2; own.id="ownHook";
      own.placeholder="הסימן שלך — איך אתה תזכור את המילה הזו?";
      own.value=T.ownDraft||((c&&c.mnemonic)||"");
      own.oninput=function(){T.ownDraft=own.value};
      card.appendChild(own);
    }

    var acts=el("div","row"); acts.style.marginTop="14px";
    if(!T.writingOwn){
      var takeIt=el("button","btn","שמור את הסימן הזה");
      takeIt.onclick=function(){ saveAndAdvance(j.mnemonic+(j.story?" — "+j.story:""), "claude") };
      acts.appendChild(takeIt);
      var mine=el("button","btn ghost","אכתוב משלי");
      mine.onclick=function(){T.writingOwn=true;renderTrainer()};
      acts.appendChild(mine);
    }else{
      var saveMine=el("button","btn","שמור את שלי");
      saveMine.onclick=function(){ saveAndAdvance((T.ownDraft||"").trim(), "mine") };
      acts.appendChild(saveMine);
      var back=el("button","btn ghost","חזרה להצעה שלי");
      back.onclick=function(){T.writingOwn=false;renderTrainer()};
      acts.appendChild(back);
    }
    var skip2=el("button","btn ghost","בלי סימן, המשך");
    skip2.onclick=function(){ saveAndAdvance("", "none") };
    acts.appendChild(skip2);
    card.appendChild(acts);

    if(c&&c.mnemonic){
      var prev=el("p","muted","הסימן שכבר שמור: "+c.mnemonic);
      prev.style.cssText="margin:12px 0 0;font-size:13px"; card.appendChild(prev);
    }
  }

  p.appendChild(card);
  p.appendChild(storageNote());
}

/* ---------- actions ---------- */
function submitGuess(){
  var guess=(T.guessDraft||"").trim();
  if(!guess){ T.error="כתוב משהו קודם, גם ניחוש."; renderTrainer(); return }
  if(!sampleApi) return;
  T.phase="judging"; T.error=null; renderTrainer();

  /* sample.json resolves the parsed object directly; nothing is validated for
     us, so check the one field everything downstream depends on. */
  var seed=seedFor(T.word);
  sampleApi.json(judgePrompt(T.word, guess, seed), {modelTier:"default"}).then(function(j){
    if(!j||!j.verdict) throw {code:"invalid_json"};
    T.judged=j; T.phase="result"; T.writingOwn=false; T.ownDraft="";
    T.session.seen++; if(j.verdict==="correct") T.session.right++;
    /* Missed words come back inside this session, not only tomorrow. */
    if(j.verdict!=="correct"){
      var q=T.queue; q.splice(Math.min(3,q.length),0,T.word);
    }
    renderTrainer();
  }).catch(function(err){
    var code=err&&err.code;
    T.phase="idle";
    /* invalid_json is never retried from code — the docs are explicit that a
       retry loop here just burns calls. The viewer decides. */
    T.error = code==="not_granted" ? "ההרשאה לשאול אותי לא ניתנה."
            : code==="rate_limited" ? "רגע, יותר מדי בקשות. נסה שוב בעוד כמה שניות."
            : code==="invalid_json" ? "קיבלתי תשובה לא תקינה. לחץ בדוק שוב."
            : "לא הצלחתי לבדוק כרגע. נסה שוב.";
    renderTrainer();
  });
}

function saveAndAdvance(mnemonic, source){
  var j=T.judged||{};
  /* schedule() already returns a copy, so this is safe to write to. */
  var card=schedule(cards[T.word], j.verdict==="correct");
  card.word=T.word;
  card.meaning=j.meaning||card.meaning||"";
  card.english=j.english||card.english||"";
  if(mnemonic){ card.mnemonic=mnemonic; card.source=source; card.savedAt=Date.now() }
  cards[T.word]=card;
  persistCard(card);

  T.word=null; T.judged=null; T.guessDraft=""; T.ownDraft=""; T.writingOwn=false; T.phase="idle";
  renderTrainer();
}

/* ---------- storage ---------- */
function readInto(snap){
  var out={};
  snap.docs.forEach(function(d){
    var v=d.data();
    /* Copied on the way in: the body handed back here is frozen. */
    if(v&&v.word) out[v.word]=cloneCard(v);
  });
  return out;
}

function loadCards(){
  var mine=myCards();
  if(!mine) { cards=load("amirnet.cards",{})||{}; return Promise.resolve() }
  return mine.get().then(function(snap){
    cards=readInto(snap);
    /* Before this version everything went into one shared `mnemonics`
       collection, which every viewer of the page could read. Anything still
       there belongs to whoever first opens this version — move it into their
       own private subtree, then clear it so it is shared with nobody. */
    if(Object.keys(cards).length) return;
    return migrateLegacy(mine);
  }).catch(function(){ cards=load("amirnet.cards",{})||{} });
}

function migrateLegacy(mine){
  return dbApi.collection("mnemonics").get().then(function(snap){
    var old=readInto(snap);
    var words=Object.keys(old);
    if(!words.length) return;
    cards=old;
    save("amirnet.cards", cards);
    /* One write at a time, and only clear the old copy once the new one is
       safely written: a half-finished move must never lose a hook. */
    return words.reduce(function(chain,w){
      return chain.then(function(){
        return mine.doc(docId(w)).set(cloneCard(old[w]))
          .then(function(){ return dbApi.collection("mnemonics").doc(w).delete().catch(function(){}) })
          .catch(function(){});
      });
    }, Promise.resolve());
  }).catch(function(){});
}

function persistCard(card){
  save("amirnet.cards", cards);          /* always keep a local copy */
  var mine=myCards();
  if(!mine) return;
  /* Snapshot bodies are frozen and must not be sent back as-is; send a clone.
     A failed write must not interrupt the drill — the local copy still holds.
     A rejection also means this viewer may not write their own subtree (a
     read-only guest), which the trainer reports rather than hiding. */
  try{
    mine.doc(docId(card.word)).set(JSON.parse(JSON.stringify(card)))
      .catch(function(){ noteRefusal() });
  }catch(e){ noteRefusal() }
}

/* =================== VOCABULARY QUIZ =================== */
/*
 * "Test me on what I have already learned": four options over the words that
 * carry a meaning. It is built entirely from the saved cards — the answers are
 * the meanings we agreed on during judging — so unlike the practice flow it
 * needs no `sample`, and it works in a viewer where judging is not permitted.
 *
 * The hard part is distractor quality, and it is not hypothetical. Among the
 * saved words sit careful/carefully, assumption/assumptions,
 * consistent/inconsistent and distinguish/distinguished, and contradict
 * ("סותר, עומד בסתירה") shares the term "סותר" with inconsistent
 * ("לא עקבי, סותר"). Offered against each other those make a question with two
 * defensible answers — a test that punishes knowing the word. `related` and
 * `glossClash` exist for exactly that, and a question is served with three or
 * two options rather than padded out with a distractor that is arguably right.
 *
 * What the guard does NOT catch is a loose semantic neighbour whose wording
 * differs, e.g. accuracy ("דיוק") against rigorous ("קפדני, מחמיר, דייקני").
 * The right answer there is still clearly the better one, and catching it would
 * take a Hebrew morphology pass that would reject far more than it should.
 */
var Q={items:[], i:0, answers:[], revealed:{}, done:false, size:10, fmt:"meaning"};

/*
 * The second format: real sentence-completion questions from the course bank,
 * kept only where the answer is a word already studied. Recognising a meaning
 * among four is one thing; using the word in a sentence is the thing the exam
 * actually asks for, so the words learnt here come back as exam questions.
 *
 * A question qualifies on its `v` tag, which build-app-data sets to the lower-
 * cased answer word — matching on the stem text would catch the word appearing
 * anywhere in the sentence, which is not what is being tested.
 */
function completionFor(words){
  if(!COURSE||!COURSE.length) return [];
  var want={}; words.forEach(function(w){ want[String(w).toLowerCase()]=1 });
  return COURSE.filter(function(q){
    return q.t!=="restatement" && q.v && q.v.length===1 && want[q.v[0]];
  });
}

function buildCompletionQuiz(pool, size){
  var picked=shuffled(completionFor(pool.map(function(c){return c.word})));
  if(size>0) picked=picked.slice(0,size);
  return picked.map(function(q){
    return { word:(q.v&&q.v[0])||"", dir:"completion", a:q.a,
             prompt:q.p, options:q.o.slice(),
             hook:(cards[(q.v&&q.v[0])||""]||{}).mnemonic||"" };
  });
}

/* Exactly the words the learner has made a definition for. `meaning` is written
   on every judged word, including one saved without a hook, so this is the
   studied set rather than the hooks list. */
function quizPool(){
  return Object.keys(cards).map(function(k){return cards[k]})
    .filter(function(c){ return c && c.word && String(c.meaning||"").trim() });
}

/* Same-root words. Containment catches consistent/inconsistent and
   careful/carefully; a shared prefix catches pairs that are not containments,
   such as precedent against preceding. */
function related(a,b){
  a=String(a||"").toLowerCase(); b=String(b||"").toLowerCase();
  if(!a||!b) return false;
  if(a===b) return true;
  if(a.indexOf(b)>=0||b.indexOf(a)>=0) return true;
  var n=Math.min(a.length,b.length), i=0;
  while(i<n&&a.charAt(i)===b.charAt(i)) i++;
  return i>=5;
}

/* Meanings are written as a comma-separated list, so the comparison runs term
   by term — "סותר" inside "סותר, עומד בסתירה" has to meet "סותר" inside
   "לא עקבי, סותר", which comparing the whole strings would miss. */
function glossTerms(meaning){
  return String(meaning||"").split(/[,;·|]/)
    .map(function(t){ return t.replace(/\s+/g," ").trim() })
    .filter(function(t){ return t.length>1 });
}
function glossClash(m1,m2){
  var A=glossTerms(m1), B=glossTerms(m2);
  for(var i=0;i<A.length;i++){
    for(var j=0;j<B.length;j++){
      var a=A[i], b=B[j];
      if(a===b) return true;
      if(a.length>=4 && b.indexOf(a)>=0) return true;
      if(b.length>=4 && a.indexOf(b)>=0) return true;
    }
  }
  return false;
}

/* One question. `dir` decides which side is the prompt and therefore which side
   is Latin text: the exam renderer forces the `en` class on every option, which
   would lay Hebrew options out backwards, so the quiz draws its own. */
function buildItem(card, pool, dir){
  var cands=pool.filter(function(o){
    return o.word!==card.word
        && !related(o.word, card.word)
        && !glossClash(o.meaning, card.meaning);
  });
  var rows=[{word:card.word, meaning:card.meaning, right:true}]
    .concat(shuffled(cands).slice(0,3).map(function(o){
      return {word:o.word, meaning:o.meaning, right:false};
    }));
  rows=shuffled(rows);
  var a=0;
  rows.forEach(function(r,i){ if(r.right) a=i });
  return {
    word:card.word, dir:dir, a:a,
    prompt: dir==="en2he" ? card.word : card.meaning,
    options: rows.map(function(r){ return dir==="en2he" ? r.meaning : r.word }),
    hook: card.mnemonic||""
  };
}

/* `size` of 0 means every studied word. Directions alternate over the shuffled
   order so each sitting is about half and half instead of leaving it to luck. */
function buildQuiz(pool, size){
  var picked=shuffled(pool);
  if(size>0) picked=picked.slice(0,size);
  return picked.map(function(c,i){
    return buildItem(c, pool, (i%2) ? "he2en" : "en2he");
  });
}

function resetQuiz(){ Q.items=[]; Q.i=0; Q.answers=[]; Q.revealed={}; Q.done=false }

/* The offered lengths, dropping any that the studied set cannot fill. */
function quizSizes(poolLen){
  var out=[10,25].filter(function(n){ return n<poolLen });
  out.push(0);                       /* 0 = all of them */
  return out;
}
function sizeLabel(n, poolLen){ return n ? String(n) : ("הכול ("+poolLen+")") }

/* ---------- screens ---------- */
/* practice = learn a new word · quiz = be tested · library = edit what I built */
var MODE = 'practice';

function modeSwitch(poolLen){
  var row=el("div","pick"); row.style.margin="0 0 18px";
  var built=Object.keys(cards).filter(function(k){return cards[k]&&cards[k].mnemonic}).length;
  [["practice","תרגול"],
   ["quiz","מבחן ("+poolLen+")"],
   ["library","הסימנים שלי"+(built?" ("+built+")":"")]].forEach(function(pair){
    var b=el("button",null,pair[1]);
    b.setAttribute("aria-pressed", MODE===pair[0]?"true":"false");
    b.onclick=function(){
      if(MODE===pair[0]) return;
      MODE=pair[0];
      if(MODE!=="quiz") resetQuiz();
      if(MODE!=="library") LIB.editing=null;
      renderTrainer();
    };
    row.appendChild(b);
  });
  return row;
}

/* A refusal lands after the screen has already been redrawn, so the note has
   to be corrected when it arrives rather than only at the next render. */
function noteRefusal(){
  if(!dbWritable) return;
  dbWritable=false;
  var p=$("pane-trainer");
  if(p && !p.hidden) renderTrainer();
}

/*
 * Where this person's work is being kept, said plainly. There are three real
 * cases and they behave differently, so none of them is left to be guessed:
 * a private account store, this browser only, or nothing at all.
 */
function storageNote(){
  var n=el("p","muted"); n.style.cssText="margin:14px 2px 0;font-size:12.5px;line-height:1.55";
  if(myCards()&&dbWritable)
    n.textContent="ההתקדמות שלך נשמרת בחשבון שלך בלבד, ועוברת איתך בין מכשירים. מי שמשתמש בדף הזה חוץ ממך לא רואה אותה, ואתה לא רואה את שלו.";
  else if(dbApi&&!dbWritable)
    n.textContent="ההרשאות שלך בדף הזה הן לקריאה בלבד, ולכן ההתקדמות נשמרת רק בדפדפן הזה. מי ששיתף אותך צריך לתת הרשאת עריכה כדי שהיא תישמר בחשבון שלך.";
  else
    n.textContent="ההתקדמות נשמרת בדפדפן הזה בלבד. אם תנקה את נתוני האתר או תעבור מכשיר, היא לא תעבור איתך.";
  return n;
}

/* =================== THE MNEMONIC LIBRARY =================== */
/*
 * Everything already built, open for rewriting. A hook is a personal thing and
 * the first version is rarely the one that sticks, so each entry can be edited
 * in place, swapped for the course's own hook where the course teaches one, or
 * cleared to be built again from scratch.
 *
 * Clearing removes the HOOK, not the card: the meaning and the review schedule
 * are earned separately and survive, so rewriting a hook never costs progress.
 */
var LIB={ q:'', editing:null, draft:'' };

function savedCards(){
  return Object.keys(cards).map(function(k){return cards[k]})
    .filter(function(c){ return c&&c.word&&c.mnemonic })
    .sort(function(a,b){ return (b.savedAt||0)-(a.savedAt||0) });
}

function saveHook(word, text, source){
  var c=cloneCard(cards[word]||newCard(word));
  c.word=word;
  var t=String(text||'').trim();
  if(t){ c.mnemonic=t; c.source=source||'mine'; c.savedAt=Date.now() }
  else { delete c.mnemonic; delete c.source; delete c.savedAt }
  cards[word]=c;
  persistCard(c);
  LIB.editing=null; LIB.draft='';
  renderTrainer();
}

function renderLibrary(p){
  var all=savedCards();
  if(!all.length){
    var none=el("div","card set");
    none.appendChild(el("div","eyebrow","עוד לא בנית סימנים"));
    var t=el("p",null,"כל סימן שתשמור בתרגול יופיע כאן, ותוכל לשנות אותו מתי שתרצה.");
    t.style.cssText="margin:8px 0 0;font-size:14.5px"; none.appendChild(t);
    p.appendChild(none); return;
  }

  var needle=LIB.q.trim().toLowerCase();
  var shown=needle ? all.filter(function(c){
    return (c.word+' '+(c.meaning||'')+' '+(c.mnemonic||'')).toLowerCase().indexOf(needle)>=0;
  }) : all;

  var search=document.createElement("input");
  search.type="search"; search.className="note-field"; search.id="libSearch";
  search.placeholder="חיפוש לפי מילה, פירוש או סימן…";
  search.value=LIB.q; search.style.marginTop="0";
  search.oninput=function(){ LIB.q=search.value; renderLibrary2() };
  p.appendChild(search);

  var count=el("p","muted", shown.length===all.length
    ? (all.length+" סימנים")
    : (shown.length+" מתוך "+all.length));
  count.style.cssText="margin:8px 2px 12px;font-size:13.5px"; p.appendChild(count);

  shown.forEach(function(c){
    var d=el("div","card"); d.style.cssText="padding:13px 15px;margin-bottom:9px";

    var top=el("div","row"); top.style.cssText="justify-content:space-between;align-items:baseline";
    var left=el("div");
    var w=el("span","en",c.word);
    w.style.cssText="font-weight:700;color:var(--accent);font-size:16px";
    left.appendChild(w);
    if(c.meaning){ var m=el("span",null," — "+c.meaning); m.style.fontSize="14px"; left.appendChild(m) }
    if(c.source==="course"){ var tag=el("span","pill","מהקורס"); tag.style.marginInlineStart="8px"; left.appendChild(tag) }
    top.appendChild(left);
    if(c.lapses) top.appendChild(el("span","muted","טעית "+c.lapses));
    d.appendChild(top);

    if(LIB.editing===c.word){
      var ta=document.createElement("textarea");
      ta.className="note-field"; ta.rows=3; ta.id="libEdit";
      ta.value=LIB.draft; ta.placeholder="הסימן שלך למילה הזו…";
      ta.oninput=function(){ LIB.draft=ta.value };
      ta.onkeydown=function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) saveHook(c.word,LIB.draft,"mine") };
      d.appendChild(ta);

      var seed=seedFor(c.word);
      if(seed&&seed.hook){
        var alt=el("div","expl"); alt.style.marginTop="10px";
        alt.appendChild(el("div","eyebrow","הסימן שהקורס מלמד"));
        var ah=el("p",null,seed.hook); ah.style.cssText="margin:7px 0 0;font-size:14.5px";
        alt.appendChild(ah);
        var take=el("button","btn ghost","קח את זה"); take.style.cssText="margin-top:10px;padding:7px 14px;font-size:13px";
        take.onclick=function(){ LIB.draft=seed.hook; renderTrainer() };
        alt.appendChild(take);
        d.appendChild(alt);
      }

      var acts=el("div","row"); acts.style.marginTop="12px";
      var ok=el("button","btn","שמור"); ok.onclick=function(){ saveHook(c.word,LIB.draft,"mine") };
      acts.appendChild(ok);
      var cancel=el("button","btn ghost","ביטול");
      cancel.onclick=function(){ LIB.editing=null; LIB.draft=""; renderTrainer() };
      acts.appendChild(cancel);
      var wipe=el("button","btn ghost","מחק את הסימן");
      wipe.style.color="var(--bad)";
      wipe.onclick=function(){ saveHook(c.word,"",null) };
      acts.appendChild(wipe);
      d.appendChild(acts);

      var keep=el("p","muted","המחיקה מוחקת את הסימן בלבד — הפירוש וההתקדמות בחזרות נשארים.");
      keep.style.cssText="margin:9px 0 0;font-size:12.5px"; d.appendChild(keep);
    }else{
      var h=el("div",null,c.mnemonic);
      h.style.cssText="font-size:14px;margin-top:5px;line-height:1.55"; d.appendChild(h);
      var edit=el("button","btn ghost","ערוך");
      edit.style.cssText="margin-top:10px;padding:6px 14px;font-size:13px";
      edit.onclick=function(){ LIB.editing=c.word; LIB.draft=c.mnemonic||""; renderTrainer() };
      d.appendChild(edit);
    }
    p.appendChild(d);
  });
}

/* Re-render only the library, so typing in the search box keeps focus. */
function renderLibrary2(){
  var p=$("pane-trainer");
  var old=p.querySelector("#libSearch");
  var at=old?old.selectionStart:null;
  renderTrainer();
  var next=$("pane-trainer").querySelector("#libSearch");
  if(next){ next.focus(); if(at!=null) try{ next.setSelectionRange(at,at) }catch(e){} }
}

function renderQuizInto(p, pool){
  if(pool.length<2){
    var few=el("div","card set");
    few.appendChild(el("div","eyebrow","עוד לא מספיק מילים"));
    var t=el("p",null,"כדי לבנות מבחן צריך לפחות שתי מילים עם פירוש שמור. תרגל עוד קצת וחזור לכאן.");
    t.style.cssText="margin:8px 0 0;font-size:14.5px"; few.appendChild(t);
    p.appendChild(few);
    return;
  }
  if(!Q.items.length) return renderQuizSetup(p, pool);
  if(Q.done) return renderQuizResults(p);
  renderQuizQuestion(p);
}

function renderQuizSetup(p, pool){
  var avail=completionFor(pool.map(function(x){return x.word})).length;
  if(Q.fmt==="completion"&&!avail) Q.fmt="meaning";

  var c=el("div","card set"); c.style.padding="20px";

  c.appendChild(el("div","eyebrow","סוג המבחן"));
  var fmts=el("div","pick");
  [["meaning","פירושים"],["completion","השלמת משפטים ("+avail+")"]].forEach(function(pair){
    var b=el("button",null,pair[1]);
    b.setAttribute("aria-pressed", Q.fmt===pair[0]?"true":"false");
    b.disabled = pair[0]==="completion" && !avail;
    b.onclick=function(){ Q.fmt=pair[0]; renderTrainer() };
    fmts.appendChild(b);
  });
  c.appendChild(fmts);

  var cap = Q.fmt==="completion" ? avail : pool.length;
  var sizes=quizSizes(cap);
  if(sizes.indexOf(Q.size)<0) Q.size=sizes[0];

  var sizeHead=el("div","eyebrow","כמה שאלות"); sizeHead.style.marginTop="18px";
  c.appendChild(sizeHead);
  var row=el("div","pick");
  sizes.forEach(function(n){
    var b=el("button",null,sizeLabel(n,cap));
    b.setAttribute("aria-pressed", Q.size===n?"true":"false");
    b.onclick=function(){ Q.size=n; renderTrainer() };
    row.appendChild(b);
  });
  c.appendChild(row);

  var how=el("p","muted", Q.fmt==="completion"
    ? "שאלות השלמת משפטים אמיתיות מהקורס, רק כאלה שהתשובה שלהן היא מילה שכבר למדת. אין משוב עד הסוף."
    : "מוצגת מילה ואתה בוחר את הפירוש מתוך ארבע אפשרויות. חלק מהשאלות בכיוון ההפוך — פירוש, ואתה בוחר את המילה. אין משוב עד הסוף.");
  how.style.cssText="margin:16px 0 0;font-size:14px"; c.appendChild(how);
  var sched=el("p","muted","מילה שתטעה בה תחזור לתרגול מחר. אם נעזרת בסימן כדי לענות — היא תחזור גם כן, גם אם ענית נכון.");
  sched.style.cssText="margin:6px 0 0;font-size:13.5px"; c.appendChild(sched);

  var go=el("button","btn","התחל את המבחן ←"); go.style.marginTop="16px"; go.id="quizStart";
  go.onclick=function(){
    Q.items = Q.fmt==="completion" ? buildCompletionQuiz(pool, Q.size) : buildQuiz(pool, Q.size);
    Q.answers=new Array(Q.items.length).fill(null);
    Q.i=0; Q.revealed={}; Q.done=false;
    renderTrainer();
  };
  c.appendChild(go);
  p.appendChild(c);
}

function renderQuizQuestion(p){
  var it=Q.items[Q.i];
  var c=el("div","card qbox");

  c.appendChild(el("div","qnum","שאלה "+(Q.i+1)+" מתוך "+Q.items.length));
  var latinPrompt = it.dir!=="he2en";          /* completion and en2he are English */
  var qt=el("div","qtext"+(latinPrompt?" en":""), it.prompt);
  if(it.dir==="en2he")
    qt.style.cssText="font-family:var(--font-display);font-weight:900;font-size:31px;color:var(--accent);margin-bottom:6px";
  c.appendChild(qt);
  var ask=el("p","muted", it.dir==="completion" ? "איזו מילה משלימה את המשפט?"
                        : it.dir==="en2he" ? "מה הפירוש?" : "איזו מילה זאת?");
  ask.style.cssText="margin:0 0 15px;font-size:14px"; c.appendChild(ask);

  var opts=el("div","opts");
  it.options.forEach(function(text,i){
    var b=el("button","opt"); b.type="button";
    b.setAttribute("aria-pressed", Q.answers[Q.i]===i?"true":"false");
    b.appendChild(el("span","k",LETTERS[i]));
    /* Only the Latin side gets `en`; the Hebrew side must stay RTL. A
       completion question is English on both sides. */
    b.appendChild(el("span","v"+(it.dir==="en2he"?"":" en"), text));
    b.onclick=function(){
      Q.answers[Q.i]=(Q.answers[Q.i]===i?null:i);
      renderTrainer();
    };
    opts.appendChild(b);
  });
  c.appendChild(opts);

  /* The hook is the learner's own, so revealing it is allowed — but it is
     recorded, because a word that needed its crutch is not learnt yet. */
  if(it.hook){
    if(Q.revealed[it.word]){
      var shown=el("div","expl"); shown.style.marginTop="14px";
      shown.appendChild(el("div","eyebrow","הסימן שלך"));
      var hk=el("p",null,it.hook); hk.style.cssText="margin:7px 0 0;font-size:15px";
      shown.appendChild(hk);
      c.appendChild(shown);
    }else{
      var hint=el("button","btn ghost","הצג את הסימן שלי"); hint.id="quizHint";
      hint.style.cssText="margin-top:14px;padding:8px 15px;font-size:13.5px";
      hint.onclick=function(){ Q.revealed[it.word]=1; renderTrainer() };
      c.appendChild(hint);
    }
  }

  var nav=el("div","nav");
  var prev=el("button","btn ghost","→ הקודמת"); prev.disabled=Q.i===0;
  prev.onclick=function(){ if(Q.i>0){Q.i--;renderTrainer()} };
  nav.appendChild(prev);
  if(Q.i<Q.items.length-1){
    var next=el("button","btn","הבאה ←");
    next.onclick=function(){ Q.i++; renderTrainer() };
    nav.appendChild(next);
  }else{
    var fin=el("button","btn","סיים את המבחן"); fin.id="quizFinish";
    fin.onclick=finishQuiz;
    nav.appendChild(fin);
  }
  c.appendChild(nav);

  var dots=el("div","dots");
  Q.items.forEach(function(_,i){
    var d=el("button","dot qdot"+(Q.answers[i]!=null?" ans":"")+(i===Q.i?" cur":""),String(i+1));
    d.onclick=function(){ Q.i=i; renderTrainer() };
    dots.appendChild(d);
  });
  c.appendChild(dots);

  p.appendChild(c);
}

function finishQuiz(){
  Q.done=true;
  Q.items.forEach(function(it,i){
    var card=cards[it.word];
    if(!card) return;
    var ok = Q.answers[i]===it.a;
    /* A right answer that needed the hook is not a remembered word: it counts
       in the score, but the schedule treats it as a miss so it comes back. */
    var credit = ok && !Q.revealed[it.word];
    var next=schedule(card, credit, true);
    next.word=it.word;
    cards[it.word]=next;
    persistCard(next);
  });
  renderTrainer();
}

function renderQuizResults(p){
  var right=0, missed=[];
  Q.items.forEach(function(it,i){
    if(Q.answers[i]===it.a) right++;
    else missed.push(it.word);
  });
  var helped=Q.items.filter(function(it,i){
    return Q.answers[i]===it.a && Q.revealed[it.word];
  }).map(function(it){ return it.word });
  var pct=Math.round(right/Q.items.length*100);

  var sc=el("div","card quiz-score");
  sc.appendChild(el("div","eyebrow","מבחן על מה שלמדתי"));
  sc.appendChild(el("div","qpct",right+"/"+Q.items.length));
  var sub=el("div","muted",pct+"% נכון");
  sub.style.cssText="margin-top:4px;font-size:15px"; sc.appendChild(sub);
  if(helped.length){
    var hh=el("p","muted",helped.length+" מהן ענית נכון אחרי שהצגת את הסימן — הן יחזרו מחר.");
    hh.style.cssText="margin:10px auto 0;font-size:13.5px;max-width:44ch"; sc.appendChild(hh);
  }
  var acts=el("div","row"); acts.style.cssText="justify-content:center;margin-top:18px";
  var again=el("button","btn","מבחן נוסף");
  again.onclick=function(){ resetQuiz(); renderTrainer() };
  acts.appendChild(again);
  var back=el("button","btn ghost","חזרה לתרגול");
  back.onclick=function(){ MODE="practice"; resetQuiz(); renderTrainer() };
  acts.appendChild(back);
  sc.appendChild(acts);
  p.appendChild(sc);

  if(missed.length){
    var box=el("div","card set");
    box.appendChild(el("div","eyebrow","לחזור על אלה"));
    var list=el("p","en",missed.join(" · "));
    list.style.cssText="margin:8px 0 0;font-size:15px;font-weight:700;color:var(--accent)";
    box.appendChild(list);
    p.appendChild(box);
  }

  var h=el("h3",null,"סקירה"); h.style.cssText="margin:22px 0 10px;font-size:18px";
  p.appendChild(h);

  Q.items.forEach(function(it,i){
    var ok=Q.answers[i]===it.a;
    var r=el("div","card rev "+(ok?"right":"wrong"));
    var top=el("div","row"); top.style.justifyContent="space-between";
    var w=el("span","en",it.word);
    w.style.cssText="font-weight:700;color:var(--accent);font-size:16px";
    top.appendChild(w);
    top.appendChild(el("span","pill", ok?"נכון":"לא נכון"));
    r.appendChild(top);

    var correct=el("p",null,(it.dir==="completion"?"המילה הנכונה: ":"הפירוש: ")+it.options[it.a]);
    correct.style.cssText="margin:8px 0 0;font-size:14.5px";
    if(it.dir!=="en2he") correct.className="en";
    r.appendChild(correct);

    if(!ok){
      var chose=el("p","muted", Q.answers[i]==null ? "לא ענית." : ("בחרת: "+it.options[Q.answers[i]]));
      chose.style.cssText="margin:4px 0 0;font-size:14px"; r.appendChild(chose);
    }
    if(Q.revealed[it.word]){
      var usedHint=el("p","muted","נעזרת בסימן.");
      usedHint.style.cssText="margin:4px 0 0;font-size:13px"; r.appendChild(usedHint);
    }
    if(it.hook){
      var hk=el("p","muted",it.hook);
      hk.style.cssText="margin:8px 0 0;font-size:13.5px"; r.appendChild(hk);
    }
    /* Only the completion format is a real exam question; the meaning quiz is
       built from the saved cards and has no sentence to read signals out of. */
    if(it.dir==="completion"){
      var qhb=hintBlock({p:it.prompt,o:it.options,a:it.a});
      if(qhb) r.appendChild(qhb);
    }
    p.appendChild(r);
  });
}

/* =================== EXPORT =================== */
/*
 * Saving the run as a real file goes through the viewer's `downloads`
 * capability — the page cannot write a file itself, and a plain link or a
 * blob: save is inert here. `claude.use()` resolves later and may resolve
 * null, so the file button only appears once it has, and the clipboard and
 * the selectable box are always present as the path that needs no capability.
 */
var downloadsApi=null;
try{
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(d){ downloadsApi=d||null })
      .catch(function(){ downloadsApi=null });
  }
}catch(e){ downloadsApi=null }

function exportFilename(){
  var d=lastRun?lastRun.at:new Date();
  return "amirnet-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+
         String(d.getMinutes()).padStart(2,"0")+".md";
}
function buildExport(){
  if(!lastRun) return "";
  var L=[];
  var d=lastRun.at;
  var stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+
            " "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");

  L.push("# "+lastRun.title);
  L.push("");
  L.push(stamp);
  L.push("");
  L.push("**ציון מוערך:** "+lastRun.score+"  ·  **רמה:** "+lastRun.band.name+" ("+lastRun.band.note+")");
  L.push("**נכונות:** "+lastRun.correct+" מתוך "+lastRun.total+" ("+lastRun.pct+"%)");
  L.push("");
  L.push("> הציון הוא אומדן תרגול. מאל״ו אינם מפרסמים את נוסחת ההמרה; הרמות בטבלה רשמיות, המספר אינו ציון אמירנט.");
  L.push("");

  if(lastRun.trail.length){
    L.push("## מסלול הרמות");
    L.push("");
    L.push("| פרק | רמה | אחוז |");
    L.push("|---|---|---|");
    lastRun.trail.forEach(function(t){
      L.push("| "+t.slot+" | "+(LEVEL_HE[t.level]||t.level)+" | "+t.pct+"% |");
    });
    L.push("");
  }

  L.push("## השאלות");
  L.push("");
  var lastPassage=null;
  lastRun.review.forEach(function(r,i){
    if(r.passage&&r.passage!==lastPassage){
      lastPassage=r.passage;
      L.push("### קטע הקריאה: "+r.passage.title);
      L.push("");
      L.push("> "+r.passage.text);
      L.push("");
    }
    L.push("**"+(i+1)+".** ("+(TYPE_HE[r.type]||r.type)+(r.q.d?" · "+(DIFF_HE[r.q.d]||r.q.d):"")+")  "+(r.ok?"✓ נכון":(r.given==null?"— לא נענתה":"✗ שגוי")));
    L.push("");
    L.push(r.q.p);
    L.push("");
    r.q.o.forEach(function(opt,oi){
      var mark = oi===r.q.a ? " ← התשובה הנכונה" : (oi===r.given ? " ← מה שסימנת" : "");
      L.push("- **"+LETTERS[oi]+".** "+opt+mark);
    });
    L.push("");
    if(r.q.e){ L.push("*למה:* "+r.q.e); L.push("") }
    var n=notes[noteKey(r.q)];
    if(n){ L.push("*ההערה שלי:* "+n); L.push("") }
  });

  return L.join("\n");
}

function showExport(){
  var text=buildExport();
  if(!text) return;
  var root=$("results");

  var old=$("exportPanel"); if(old) old.parentNode.removeChild(old);
  var box=el("div","card set"); box.id="exportPanel";
  box.style.cssText="margin:14px 0";
  box.appendChild(el("div","eyebrow","שמירת המבחן"));

  var msg=el("p","muted","הורד כקובץ Markdown, או העתק והדבק ל-Word, Notion או הערות.");
  msg.style.cssText="font-size:13.5px;margin:6px 0 10px"; box.appendChild(msg);

  var row=el("div","row");

  if(downloadsApi){
    var dl=el("button","btn","הורד קובץ");
    dl.onclick=function(){
      status.textContent="…";
      downloadsApi.save({filename:exportFilename(),data:text}).then(function(res){
        status.textContent = res && res.status==="delivered" ? "נשלח ✓" : "נשמר ✓";
      }).catch(function(err){
        var code=err&&err.code;
        if(code==="declined"){ status.textContent=""; return; }           /* never re-ask */
        if(code==="rate_limited"){ status.textContent="יש כבר בקשה פתוחה — נסה שוב בעוד רגע."; return; }
        status.textContent="שמירת הקובץ לא זמינה כאן — העתק את הטקסט למטה.";
        ta.focus(); ta.select();
      });
    };
    row.appendChild(dl);
  }

  var copy=el("button","btn ghost","העתק הכל");
  var status=el("span","muted"); status.style.fontSize="13.5px";
  copy.onclick=function(){
    try{
      navigator.clipboard.writeText(text).then(function(){
        status.textContent="הועתק ✓";
      }).catch(function(){
        status.textContent="הדפדפן חסם העתקה — סמן את הטקסט למטה והעתק ידנית.";
        ta.focus(); ta.select();
      });
    }catch(e){
      status.textContent="הדפדפן חסם העתקה — סמן את הטקסט למטה והעתק ידנית.";
      ta.focus(); ta.select();
    }
  };
  row.appendChild(copy); row.appendChild(status); box.appendChild(row);

  var ta=document.createElement("textarea");
  ta.className="note-field"; ta.rows=14; ta.readOnly=true; ta.value=text; ta.id="exportText";
  ta.style.cssText="margin-top:12px;font-family:ui-monospace,monospace;font-size:12.5px;direction:ltr;text-align:left";
  box.appendChild(ta);

  root.insertBefore(box, root.children[1]||null);
  box.scrollIntoView({behavior:"smooth",block:"center"});
}

/* =================== VOCABULARY =================== */
var VOCAB=null;
var lastRun=null;                              /* kept so the export survives leaving the results screen */
var readingCollapsed=false;                    /* the test's own "Hide Questions" */
var notes=load("amirnet.notes",{})||{};        /* per-question notes, keyed by question text */
function noteKey(q){ return (q.p||"").slice(0,120) }
function renderVocab(){
  var p=$("pane-vocab");
  if(p.dataset.ready)return;
  p.dataset.ready="1";

  var head=el("div");
  var h=el("h2",null,"אוצר המילים של הקורפוס"); h.style.cssText="font-size:23px;margin-bottom:8px";
  head.appendChild(h);
  var sub=el("p","muted","כל מילה שהקורפוס מסמן כנדרשת לפתרון — 294 מהן היו התשובה הנכונה, והשאר מילים שמכריעות שאלה גם כשאינן התשובה. מסומנות בכוכבית אלה שהיו תשובה.");
  sub.style.cssText="margin:0 0 14px;font-size:14.5px";
  head.appendChild(sub);
  p.appendChild(head);

  var search=el("input"); search.type="search"; search.id="vocabSearch";
  search.placeholder="חיפוש מילה…";
  search.style.cssText="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:14px";
  p.appendChild(search);

  /* The corpus list is ordered by frequency, which puts so/because/but at the
     top — exactly the words with nothing to teach. The list stays complete,
     but this narrows it to the words the course actually glosses. */
  var filt=el("div","pick"); filt.style.margin="0 0 14px";
  [["all","כל המילים"],["taught","רק מה שהקורס מלמד"]].forEach(function(pair){
    var b=el("button",null,pair[1]);
    b.setAttribute("aria-pressed", VOCAB_SCOPE===pair[0]?"true":"false");
    b.onclick=function(){
      VOCAB_SCOPE=pair[0];
      Array.prototype.forEach.call(filt.querySelectorAll("button"),function(x,i){
        x.setAttribute("aria-pressed", VOCAB_SCOPE===(i?"taught":"all")?"true":"false");
      });
      paintVocab((($("vocabSearch")||{}).value||"").trim().toLowerCase());
    };
    filt.appendChild(b);
  });
  p.appendChild(filt);

  var list=el("div"); list.id="vocabList";
  list.style.cssText="display:flex;flex-direction:column;gap:7px";
  p.appendChild(list);

  var status=el("div","muted","טוען…"); list.appendChild(status);

  fetch("vocabulary.json").then(function(r){return r.json()}).then(function(j){
    VOCAB=j; paintVocab("");
    search.oninput=function(){paintVocab(search.value.trim().toLowerCase())};
  }).catch(function(){ status.textContent="לא ניתן לטעון את רשימת המילים." });

  /* The glosses and hooks live in the trainer pool, and the saved cards decide
     which hooks are already adopted. Either can still be unloaded when this tab
     is opened first, so both are fetched here and the rows repainted after. */
  ensureTrainerData().then(function(){
    if(VOCAB) paintVocab(($("vocabSearch").value||"").trim().toLowerCase());
  });
}

var VOCAB_SCOPE="all";

function paintVocab(filter){
  var list=$("vocabList"); list.textContent="";

  /* Two different lists. "all" is the corpus vocabulary, ordered by how often a
     word decides a question. "taught" is everything the course glosses — far
     larger, and mostly words the corpus list never had — so it is built from
     the trainer pool and only borrows the corpus example where one exists. */
  var rows;
  if(VOCAB_SCOPE==="taught"){
    var byWord={};
    VOCAB.forEach(function(w){ byWord[w.word]=w });
    rows=(TRAINER||[]).filter(function(t){ return t.he||(t.seed&&t.seed.hook) })
      .map(function(t){
        var c=byWord[t.word];
        return { word:t.word, times:t.times||1, answer:c?c.answer:t.answer,
                 example:(c&&c.example)||t.example||"" };
      });
  }else{
    rows=VOCAB.slice();
  }
  rows=rows.filter(function(w){ return !filter || w.word.indexOf(filter)>=0 });
  if(!rows.length){list.appendChild(el("div","muted","לא נמצאה מילה כזו."));return}
  var count=el("div","muted",rows.length+" מילים");
  count.style.cssText="font-size:12.5px;margin-bottom:4px"; list.appendChild(count);
  rows.forEach(function(w){
    var c=el("div","card"); c.style.cssText="padding:12px 14px";
    var top=el("div","row"); top.style.cssText="justify-content:space-between;align-items:baseline;gap:10px";
    var word=el("span","en",w.word);
    word.style.cssText="font-weight:700;font-size:16.5px;color:var(--accent)";
    top.appendChild(word);
    if(w.answer) top.appendChild(el("span","pill done","★ תשובה נכונה"));
    if(w.times>1) top.appendChild(el("span","pill",w.times+" פעמים"));
    c.appendChild(top);
    /* What the course says this word means, where the guides glossed it. */
    var taught=courseEntry(w.word);
    if(taught&&taught.he){
      var he=el("div",null,taught.he);
      he.style.cssText="font-size:14.5px;margin-top:4px;font-weight:600";
      c.appendChild(he);
    }

    if(w.example){
      var ex=el("div","en",w.example.replace(/_{2,}/," ___ "));
      ex.style.cssText="font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.5";
      c.appendChild(ex);
    }

    /* The hook the course teaches, offered as a ready-made option: adopting it
       creates the card outright, so a word can be learnt straight from here
       without going through the judging flow first. */
    if(taught&&taught.seed&&taught.seed.hook){
      var box=el("div","expl"); box.style.marginTop="9px";
      box.appendChild(el("div","eyebrow","הסימן שהקורס מלמד"));
      var hk=el("p",null,taught.seed.hook);
      hk.style.cssText="margin:7px 0 0;font-size:14px;line-height:1.55";
      box.appendChild(hk);

      var have=cards[w.word];
      if(have&&have.mnemonic===taught.seed.hook){
        var done=el("div","muted","כבר שמור אצלך.");
        done.style.cssText="margin-top:9px;font-size:12.5px"; box.appendChild(done);
      }else{
        var add=el("button","btn ghost", have&&have.mnemonic?"החלף בסימן הזה":"שמור כסימן שלי");
        add.style.cssText="margin-top:10px;padding:7px 14px;font-size:13px";
        add.onclick=function(){ adoptCourseHook(w.word, taught, add) };
        box.appendChild(add);
      }
      c.appendChild(box);
    }
    list.appendChild(c);
  });
}

/* =================== TABS =================== */
function tab(which){
  var map={sims:["tab-sims","pane-sims"],set:["tab-set","pane-set"],guide:["tab-guide","pane-guide"],
           trainer:["tab-trainer","pane-trainer"],vocab:["tab-vocab","pane-vocab"]};
  Object.keys(map).forEach(function(k){
    var on=k===which;
    $(map[k][0]).setAttribute("aria-selected",on?"true":"false");
    $(map[k][1]).hidden=!on;
  });
  if(which==="set")renderSettings();
  if(which==="guide")renderGuide();
  if(which==="vocab")renderVocab();
  if(which==="trainer")renderTrainer();
}
$("tab-sims").onclick=function(){tab("sims")};
$("tab-set").onclick=function(){tab("set")};
$("tab-guide").onclick=function(){tab("guide")};
$("tab-vocab").onclick=function(){tab("vocab")};
$("tab-trainer").onclick=function(){tab("trainer")};

/* =================== BOOT =================== */
$("adaptiveBtn").onclick=function(){ if(DATA) startAdaptive() };
$("drillBtn").onclick=function(){ if(DATA) renderDrillSetup() };

/* The course drill sheets load alongside the simulations; a failure there must
   not stop the app, so the bank simply stays without them. */
fetch("course-bank.json").then(function(r){return r.json()})
  .then(function(j){ COURSE=j||[] }).catch(function(){ COURSE=[] })
  /* buildBank memoises, and this fetch can land after it has already run, so
     drop the cached bank and let the next call rebuild with the sheets in. */
  .then(function(){ BANK=null });

fetch("simulations.json").then(function(r){return r.json()}).then(function(j){
  DATA=j; renderHome();
}).catch(function(e){
  $("simGrid").appendChild(el("div","card set","לא ניתן לטעון את השאלות. נסה לרענן את העמוד."));
});
})();
</script>
